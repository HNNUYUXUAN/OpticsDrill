<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Parallel plate: paraxial apparent shift"><rect width="760" height="360" fill="white"/><g font-family="Arial,sans-serif"><text x="26" y="30" font-size="17" fill="#202428">Parallel plate: paraxial apparent shift</text><rect x="280" y="70" width="180" height="200" fill="#edf3f6" stroke="#31566e"/><line x1="70" y1="180" x2="680" y2="180" stroke="#aaa" stroke-width="2" stroke-dasharray="5 5"/><text x="325" y="140" font-size="17" fill="#202428">n = 1.5</text><text x="313" y="230" font-size="17" fill="#202428">d = 30 cm</text><text x="85" y="110" font-size="17" fill="#202428">Object</text><text x="495" y="110" font-size="17" fill="#202428">Observer</text><text x="74" y="295" font-size="17" fill="#202428">Apparent displacement = d(1 - 1/n) = 10 cm</text><text x="26" y="340" font-size="17" fill="#202428">Schematic; not to scale</text></g></svg>