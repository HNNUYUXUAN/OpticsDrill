<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Hydrogen: first four energy levels"><rect width="760" height="360" fill="white"/><g font-family="Arial,sans-serif"><text x="26" y="30" font-size="17" fill="#202428">Hydrogen: first four energy levels</text><line x1="200" y1="270" x2="570" y2="270" stroke="#31566e" stroke-width="2" /><line x1="570" y1="270" x2="588" y2="270" stroke="#aaa" stroke-width="2" /><text x="100" y="275" font-size="17" fill="#202428">n = 1</text><text x="590" y="275" font-size="17" fill="#202428">-13.600 eV</text><line x1="200" y1="117" x2="570" y2="117" stroke="#31566e" stroke-width="2" /><line x1="570" y1="117" x2="588" y2="117" stroke="#aaa" stroke-width="2" /><text x="100" y="122" font-size="17" fill="#202428">n = 2</text><text x="590" y="122" font-size="17" fill="#202428">-3.400 eV</text><line x1="200" y1="88.66666666666666" x2="570" y2="88.66666666666666" stroke="#31566e" stroke-width="2" /><line x1="570" y1="88.66666666666666" x2="588" y2="89" stroke="#aaa" stroke-width="2" /><text x="100" y="94" font-size="17" fill="#202428">n = 3</text><text x="590" y="94" font-size="17" fill="#202428">-1.511 eV</text><line x1="200" y1="78.75" x2="570" y2="78.75" stroke="#31566e" stroke-width="2" /><line x1="570" y1="78.75" x2="588" y2="50" stroke="#aaa" stroke-width="2" /><text x="100" y="55" font-size="17" fill="#202428">n = 4</text><text x="590" y="55" font-size="17" fill="#202428">-0.850 eV</text><line x1="200" y1="66" x2="570" y2="66" stroke="#aaa" stroke-width="2" stroke-dasharray="5 5"/><text x="210" y="59" font-size="17" fill="#202428">0 eV</text><text x="235" y="300" font-size="17" fill="#202428">E_n = -13.6 / n^2 eV</text><text x="26" y="340" font-size="17" fill="#202428">Energy positions to scale; labels offset</text></g></svg>